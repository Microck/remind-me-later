<nav><small>LOCAL TEST FIXTURE</small><a id="dm" href="/channels/@me/333333333333333333">Direct message</a><a id="server" href="/channels/555555555555555555/666666666666666666"># follow-ups</a></nav>
<main><h1>remind me later</h1><p>isolated browser test. not a live Discord session.</p><div class="test-card">reminders are rendered by the actual installable plugin. Discord and BetterDiscord APIs are mocked.</div></main>
<script>
window.module = {exports: {}};
window.fixture = {
 account: "111111111111111111", store: new Map(), toasts: [], alerts: [], notices: [], patches: new Map(), accountListeners: new Set(), routes: [], saves: [], errors: [], native: [],
 messages: new Map([["333333333333333333:444444444444444444", {id:"444444444444444444", channel_id:"333333333333333333", content:"not stored without opt-in"}]]),
 switchAccount(id) { this.account = id; for (const fn of this.accountListeners) fn(); }
};
window.addEventListener("error", e => fixture.errors.push(String(e.error || e.message)));
window.BdApi = {
 React: {
  cloneElement: (element, props) => ({...element, props: {...element.props, ...props}})
 },
 Data: {
  load: (plugin, key) => fixture.store.has(key) ? structuredClone(fixture.store.get(key)) : undefined,
  save: (plugin, key, value) => { if (fixture.failSave) throw new Error("Disk full"); fixture.store.set(key, structuredClone(value)); fixture.saves.push(key); }
 },
 Webpack: {
  getStore(name) {
   if (name === "UserStore") return {getCurrentUser: () => fixture.account ? {id: fixture.account} : null, addChangeListener: fn => fixture.accountListeners.add(fn), removeChangeListener: fn => fixture.accountListeners.delete(fn)};
   if (name === "ChannelStore") return {getChannel: id => id === "666666666666666666" ? {id, guild_id:"555555555555555555", name:"follow-ups"} : {id, name:""}};
   if (name === "GuildStore") return {getGuild: () => ({name:"Workspace"})};
   if (name === "MessageStore") return {getMessage: (channelId, messageId) => fixture.messages.get(`${channelId}:${messageId}`)};
  },
  getByKeys: () => fixture.noRouter ? null : {transitionTo: p => fixture.routes.push(p)}
 },
 ContextMenu: {
  patch: (name, fn) => { fixture.patches.set(name, fn); return () => fixture.patches.delete(name); },
  buildItem: props => ({type:"MockMenuItem", props}),
 },
 DOM: {
  addStyle: (id, css) => { const style = document.createElement("style"); style.id = id; style.textContent = css; document.head.append(style); },
  removeStyle: id => document.getElementById(id)?.remove()
 },
 UI: {
  showToast: (content, options) => fixture.toasts.push({content, options}),
  showNotification: options => { if (fixture.noAlerts) return undefined; const handle = {options, close() { this.closed = true; options.onClose?.(); }}; fixture.alerts.push(handle); return handle; },
  showNotice: (content, options) => { const notice = {content, options, closed: false}; const close = () => { if (!notice.closed) { notice.closed = true; options.onClose?.(); } }; notice.close = close; fixture.notices.push(notice); return close; }
 }
};
class MockNotification {
 static permission = "granted";
 static async requestPermission() { return this.permission; }
 constructor(title, options) { this.title = title; this.options = options; fixture.native.push(this); }
 close() { this.closed = true; this.onclose?.(); }
}
window.Notification = MockNotification;
</script></html>
